name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules
        run: mvn clean compile -f pom.xml

      - name: Run all tests
        run: mvn test -f pom.xml

      - name: Build artifacts
        run: mvn package -DskipTests -f pom.xml

      - name: Upload user-service artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-service-jar
          path: user-service/target/*.jar

      - name: Upload property-service artifact
        uses: actions/upload-artifact@v4
        with:
          name: property-service-jar
          path: property-service/target/*.jar

      - name: Upload booking-service artifact
        uses: actions/upload-artifact@v4
        with:
          name: booking-service-jar
          path: booking-service/target/*.jar

      - name: Upload notification-service artifact
        uses: actions/upload-artifact@v4
        with:
          name: notification-service-jar
          path: notification-service/target/*.jar

      - name: Upload api-gateway artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-jar
          path: api-gateway/target/*.jar

  static-analysis:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        run: mvn checkstyle:check -f pom.xml || true

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build user-service Docker image
        run: docker build -f user-service/Dockerfile -t booking-user-service:latest .

      - name: Build property-service Docker image
        run: docker build -f property-service/Dockerfile -t booking-property-service:latest .

      - name: Build booking-service Docker image
        run: docker build -f booking-service/Dockerfile -t booking-booking-service:latest .

      - name: Build notification-service Docker image
        run: docker build -f notification-service/Dockerfile -t booking-notification-service:latest .

      - name: Build api-gateway Docker image
        run: docker build -f api-gateway/Dockerfile -t booking-api-gateway:latest .